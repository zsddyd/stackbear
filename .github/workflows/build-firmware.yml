name: Build firmware

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Set artifact name
        id: artifact_name
        run: echo "name=passport-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: |
            build/FoloToy-AI-Passport-full.bin
            build/FoloToy-AI-Passport-ota.bin
            build/ota-latest.json
          if-no-files-found: error

      # Push the OTA image and manifest to the receiver so the device can pull
      # them. Skipped unless the ECS credentials are configured.
      - name: Publish OTA package to the ECS
        if: ${{ github.event_name == 'workflow_dispatch' && secrets.ECS_HOST != '' }}
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_PASSWORD: ${{ secrets.ECS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          pub="$(python3 -c "import json;print(json.load(open('build/ota-latest.json'))['published_name'])")"
          sshpass -p "$ECS_PASSWORD" scp -o StrictHostKeyChecking=accept-new \
            "build/FoloToy-AI-Passport-ota.bin" "$ECS_USER@$ECS_HOST:/tmp/$pub"
          sshpass -p "$ECS_PASSWORD" scp -o StrictHostKeyChecking=accept-new \
            build/ota-latest.json "$ECS_USER@$ECS_HOST:/tmp/ota-latest.json"
          # Move into place atomically-ish: the image first, then the manifest,
          # so a device polling mid-copy never sees a manifest without an image.
          sshpass -p "$ECS_PASSWORD" ssh -o StrictHostKeyChecking=accept-new \
            "$ECS_USER@$ECS_HOST" \
            "mkdir -p ~/Software/stackbear/firmware && \
             mv /tmp/$pub ~/Software/stackbear/firmware/$pub && \
             mv /tmp/ota-latest.json ~/Software/stackbear/firmware/latest.json && \
             ls -l ~/Software/stackbear/firmware"

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          files: release/FoloToy-AI-Passport-full.bin
          fail_on_unmatched_files: true
